<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not Found — Stand Guard</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#080b12;--gold-l:#e8b84b;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
        --border-gold:rgba(201,146,42,0.3);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;line-height:1.6;}
  .wrap{max-width:520px;text-align:center;}
  .mark{font-size:2.6rem;margin-bottom:.6rem;}
  h1{font-size:1.35rem;color:var(--gold-l);letter-spacing:.04em;margin-bottom:.6rem;font-weight:600;}
  p{font-size:.9rem;color:var(--text2);margin-bottom:.5rem;}
  .note{font-size:.78rem;color:var(--text3);margin-top:1.4rem;border-top:1px solid var(--border-gold);padding-top:1.1rem;}
  code{color:var(--text2);}
  a{color:var(--gold-l);text-decoration:none;border-bottom:1px solid var(--border-gold);}
  a:hover{color:#f5c842;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark" aria-hidden="true">&#128737;</div>
    <h1>Not found</h1>
    <p>There is nothing at this address.</p>
    <p><a href="/">Return to Stand Guard</a></p>
    <p class="note">
      If you are an automated client: this is a real 404, not a page that renders one.
      Nothing is published at this path. Absence is reported as absence rather than as
      an empty success.
    </p>
  </div>
</body>
</html>
